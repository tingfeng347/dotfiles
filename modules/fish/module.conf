# fish 模块元数据
MODULE_DESC="fish shell + fisher 插件清单"

# 采集来源: 源路径|仓库内相对 home/ 的路径
CAPTURE_PATHS=(
  "$HOME/.config/fish|.config/fish"
)

# 采集排除: 运行时状态 + fisher 托管文件(由 fish_plugins 清单重新拉取)
CAPTURE_EXCLUDES=(
  fish_variables
  fish_history
  .DS_Store
  functions/fisher.fish
  functions/fzf_configure_bindings.fish
  functions/_fzf_*.fish
  completions/fzf_configure_bindings.fish
  conf.d/fzf.fish
  conf.d/miyu.fish
)

# 行级隔离: 本机安装器 (LM Studio / jcode) 追加进 config.fish 的块, 不同步进仓库
CAPTURE_STRIP=(
  '/# Added by LM Studio CLI/,/# End of LM Studio CLI section/d'
  '/^# Added by jcode installer$/,/^end$/d'
)
