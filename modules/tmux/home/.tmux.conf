# ========================================
# 快捷键
# ========================================
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# ========================================
# 基本行为
# ========================================
set -g base-index 1                     # 窗口编号从 1 开始
set -g pane-base-index 1                # 面板编号从 1 开始
set -g mouse on                         # 启用鼠标
set -g history-limit 10000              # 回滚行数
set -g escape-time 0                    # 快捷键延迟
set -g assume-paste-time 1              # 粘贴优化

# ========================================
# 键盘模式
# ========================================
set -g status-keys vi
set -g mode-keys vi

# ========================================
# 默认程序
# ========================================
set -g editor vim
set -g default-shell /usr/bin/zsh
set -g default-terminal 'tmux-256color'

# ========================================
# 面板显示
# ========================================
set -g display-panes-active-colour red
set -g display-panes-colour blue

# ========================================
# 状态栏 -- 布局与内容
# ========================================
set -g status-interval 15               # 刷新间隔（秒）
set -g status-left-length 0                # 左侧留空
set -g status-right-length 40
set -g status-justify left                  # 窗口列表左对齐
set -g status-left ''
set -g status-right " #{=21:pane_title}  %H:%M "
set -g window-status-separator ' '          # 窗口分隔符

# 窗口标签样式
set -g window-status-format ' #[fg=colour245]#I:#W#[/fg]'
set -g window-status-current-format ' #[fg=white,bg=default]#I:#W#[/fg,#/bg]'
set -g window-status-separator ''
set -g window-status-style "fg=colour245,bg=default"
set -g window-status-current-style "fg=white,bg=default,nobold"

# ========================================
# 状态栏 -- 样式
# ========================================
set -g status-style "bg=default,fg=white"     # 透明背景 + 白字

# ========================================
# 面板边框样式
# ========================================
set -g pane-active-border-style fg=white       # 活动面板边框：白色
set -g pane-border-style fg=colour240           # 非活动面板边框：中灰
set -g pane-border-lines simple                 # 边框线型：ASCII 简单线
set -g pane-border-indicators colour            # 边框指示符彩色

# ========================================
# 弹窗 / 菜单样式
# ========================================
set -g message-command-style "bg=black,fg=yellow,fill=black"
set -g menu-selected-style "bg=yellow,fg=black"

# ========================================
# 复制模式样式
# ========================================
set -g copy-mode-match-style "bg=cyan,fg=black"
set -g copy-mode-current-match-style "bg=magenta,fg=black"
set -g copy-mode-mark-style "bg=red,fg=black"
set -g copy-mode-line-number-style "fg=white,dim"
set -g copy-mode-current-line-number-style "fg=yellow"

# ========================================
# 浮动终端弹窗 (C-t 一键唤起)
# ========================================
bind -n C-t if-shell -F '#{==:#{session_name},popup-server}' \
    'detach-client' \
    'display-popup -E -w 80% -h 80% "tmux new-session -A -s popup-server"'

# ========================================
# 终端特性 / 剪贴板
# ========================================
set -as terminal-overrides "linux*:AX@"
set -as terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title"
set -as terminal-features "screen*:title"
set -as terminal-features "rxvt*:ignorefkeys"
set -g set-clipboard external

# ========================================
# 消息 / 模式行样式
# ========================================
set -g message-style "bg=default,fg=white"
set -g mode-style "bg=default,fg=white"

# ========================================
# 插件 (TPM)
# ========================================
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-save-interval 15
set -g @continuum-restore on
set -g @continuum-boot on

# tmux-resurrect: 保存时深度搜索 pane 内真正的前台命令（跳过 shell 本身）
set -g @resurrect-save-command-strategy 'deep_leaf'
# 恢复所有识别到的程序（可改为具体列表如 'nvim python node'）
set -g @resurrect-processes ':all:'

run '~/.tmux/plugins/tpm/tpm'
